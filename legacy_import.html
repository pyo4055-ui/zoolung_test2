<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>(구) 예약접수 업로드</title><link rel="stylesheet" href="legacy_import_ui_v1.css"><main>
<header><div class="title-row"><h1>(구) 예약접수 업로드</h1><button type="button" class="help-button" id="help" aria-label="구 예약접수 업로드 도움말">?</button></div><span class="badge">운영 예약 가져오기</span></header>
<section class="card"><div class="filters"><label>연도<select id="year"></select></label><label>엑셀파일<input type="file" id="file" accept=".xlsx,.xlsm"></label><button id="upload">파일 불러오기</button></div><div id="message" role="status" aria-live="polite"></div></section>
<section class="card"><div id="months" class="months"></div><div class="heading"><h2>가져올 예약 확인</h2><div id="counts"></div></div><div class="actions"><button class="soft" id="add">+ 추가</button><button class="soft" id="delete">선택한 예약 삭제</button><button id="save">수정 내용 저장</button><button class="green" id="register">선택한 예약 등록</button></div><label class="selectall"><input type="checkbox" id="all"> 이 페이지 선택</label><div id="list"></div><div class="pages"><button class="soft" id="prev">이전</button><span id="page"></span><button class="soft" id="next">다음</button></div></section>
<dialog id="cafe"><header><h2>카페 주문 내역</h2><button class="soft" id="cafeClose">닫기</button></header><p>엑셀에 메뉴 내역이 없으면 직접 입력해주세요.</p><div id="cafeRows"></div><button class="soft" id="cafeAdd">+ 메뉴 추가</button><div class="actions"><button id="cafeSave">주문 내용 적용</button></div></dialog>
</main><script src="legacy_xlsx_reader_v1.js"></script><script src="legacy_import_model_v1.js"></script><script src="legacy_import_api_v1.js"></script><script src="legacy_import_ui_v1.js"></script></html>
