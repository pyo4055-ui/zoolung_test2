<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f4">
<title>주렁주렁 동탄점 단체예약</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f6f7f4;color:#1f2a23}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box}.box{background:white;border:1px solid #dfe5df;border-radius:18px;padding:26px;max-width:420px;width:100%;box-shadow:0 6px 24px rgba(30,50,36,.07)}.spin{width:34px;height:34px;border:4px solid #e9f3ed;border-top-color:#2f6b4f;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#6d756f;line-height:1.6}
</style>
</head>
<body>
<div class="loading"><div class="box"><div class="spin"></div><b>주렁주렁 단체예약</b><br><small>고객 예약 화면을 준비하는 중입니다.</small><div id="error"></div></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('./index.html?v=customer-entry-2',{cache:'no-store'});
    if(!r.ok)throw new Error('공통 예약 런타임을 불러오지 못했습니다.');
    let source=await r.text();
    const adminLoader='./admin_features_v2_loader.js?v=31';
    const customerLoader='./customer_features_loader_v1.js?v=1';
    if(!source.includes(adminLoader))throw new Error('고객 분리 연결 지점을 찾지 못했습니다.');
    source=source.replace(adminLoader,customerLoader);
    const bridgeMarker='<script src="./reservation_firebase_bridge.js?v=1"><\\/script></body>';
    const customerMarker='<script src="./customer_reservation_firebase_bridge_v1.js?v=1"><\\/script><script src="./customer_entry_bootstrap_v1.js?v=1"><\\/script><script src="./customer_entry_visual_v2_bootstrap.js?v=1"><\\/script></body>';
    if(!source.includes(bridgeMarker))throw new Error('고객 전용 화면 연결 지점을 찾지 못했습니다.');
    source=source.replace(bridgeMarker,customerMarker);
    source=source.replace('<title>주렁주렁 단체예약 테스트</title>','<title>주렁주렁 동탄점 단체예약</title>');
    document.open();document.write(source);document.close();
  }catch(e){
    document.getElementById('error').innerHTML='<p style="color:#b23838;font-size:13px;line-height:1.6">고객 예약 화면 로딩 실패<br>'+String(e.message||e)+'</p>';
  }
})();
</script>
</body>
</html>
