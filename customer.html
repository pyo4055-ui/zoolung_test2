<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#38271e">
<title>주렁주렁 동탄점 단체예약</title>
<style>
html,body{margin:0;min-height:100%;background:#38271e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#fff}.loading{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box;background:#38271e}.box{display:none}
</style>
</head>
<body>
<div class="loading"><div class="box"><div id="error"></div></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('./index.html?v=customer-entry-2',{cache:'no-store'});
    if(!r.ok)throw new Error('공통 예약 런타임을 불러오지 못했습니다.');
    let source=await r.text();
    const adminLoader='./admin_features_v2_loader.js?v=31';
    const customerLoader='./customer_features_loader_v1.js?v=1';
    if(!source.includes(adminLoader))throw new Error('고객 분리 연결 지점을 찾지 못했습니다.');
    source=source.replace(adminLoader,customerLoader);
    const bridgeMarker='<script src="./reservation_firebase_bridge.js?v=1"><\\/script></body>';
    const customerMarker='<script src="./customer_reservation_firebase_bridge_v1.js?v=1"><\\/script><script src="./customer_entry_bootstrap_v1.js?v=1"><\\/script><script src="./customer_entry_visual_v2_bootstrap.js?v=2"><\\/script></body>';
    if(!source.includes(bridgeMarker))throw new Error('고객 전용 화면 연결 지점을 찾지 못했습니다.');
    source=source.replace(bridgeMarker,customerMarker);
    source=source.replace('<title>주렁주렁 단체예약 테스트</title>','<title>주렁주렁 동탄점 단체예약</title>');
    const landingGuard='<style id="zrCustomerLandingBootGuard">html{background:#38271e!important}body{visibility:hidden!important;background:#38271e!important}</style>';
    if(!source.includes('id="zrCustomerLandingBootGuard"'))source=source.replace('</head>',landingGuard+'</head>');
    document.open();document.write(source);document.close();
  }catch(e){
    document.body.style.background='#38271e';
    document.getElementById('error').innerHTML='<p style="color:#fff;font-size:13px;line-height:1.6">고객 예약 화면 로딩 실패<br>'+String(e.message||e)+'</p>';
  }
})();
</script>
</body>
</html>
