<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주렁주렁 단체예약 테스트</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f6f7f4;color:#1f2a23}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box}.box{background:white;border:1px solid #dfe5df;border-radius:18px;padding:26px;max-width:420px;width:100%;box-shadow:0 6px 24px rgba(30,50,36,.07)}.spin{width:34px;height:34px;border:4px solid #e9f3ed;border-top-color:#2f6b4f;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#6d756f;line-height:1.6}</style>
</head>
<body>
<div class="loading"><div class="box"><div class="spin"></div><b>주렁주렁 단체예약 테스트</b><br><small>페이지를 불러오는 중입니다.</small><div id="error"></div></div></div>
<script>
(async()=>{
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('이 Safari에서는 압축 해제를 지원하지 않습니다. iOS를 최신 버전으로 업데이트해주세요.');
    const [r1,r2]=await Promise.all([
      fetch('./data1.txt?v=17',{cache:'no-store'}),
      fetch('./data2.txt?v=17',{cache:'no-store'})
    ]);
    if(!r1.ok||!r2.ok) throw new Error('테스트 데이터를 불러오지 못했습니다.');
    const a=(await r1.text()).trim();
    const b=(await r2.text()).trim();
    const bin=atob(a+b);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('error').innerHTML='<p style="color:#b23838;font-size:13px;line-height:1.6">로딩 실패<br>'+String(e.message||e)+'</p>';
  }
})();
</script>
</body>
</html>
