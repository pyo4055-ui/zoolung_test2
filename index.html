<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f6f7f4;color:#1f2a23}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box}.box{background:white;border:1px solid #dfe5df;border-radius:18px;padding:26px;max-width:420px;width:100%;box-shadow:0 6px 24px rgba(30,50,36,.07)}.spin{width:34px;height:34px;border:4px solid #e9f3ed;border-top-color:#2f6b4f;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#6d756f;line-height:1.6}

<body>
<div class="loading"><div class="box"><div class="spin"></div><b>주렁주렁 단체예약 테스트</b><br><small>페이지를 불러오는 중입니다.</small><div id="error"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
const SECURITY_PATCH=[["const PRICE=15000, ADMIN_PASSWORD=\"zoolung09\";", "const PRICE=15000;\n\n/*\n  테스트용 관리자 인증.\n  실제 운영에서는 반드시 서버 인증(Firebase/Auth 등)으로 교체할 것.\n  비밀번호 원문은 코드에 저장하지 않고 PBKDF2 결과만 저장한다.\n*/\nconst AdminGate=Object.freeze((()=>{\n  const SALT_B64=\"RActkqWKNV1i6+6cJsyjSw==\";\n  const DIGEST_B64=\"Wn/ll10jBZNJZTDsTWff59Enxa0LD6vmMIvfghWcwWg=\";\n  const ITERATIONS=250000;\n  const SESSION_MS=30*60*1000;\n  const MAX_FAILS=5;\n  const LOCK_MS=5*60*1000;\n  let sessionToken=\"\";\n  let sessionUntil=0;\n\n  const b64Bytes=v=>Uint8Array.from(atob(v),c=>c.charCodeAt(0));\n  const bytesB64=v=>{\n    let out=\"\";\n    const a=new Uint8Array(v);\n    for(let i=0;i<a.length;i++)out+=String.fromCharCode(a[i]);\n    return btoa(out);\n  };\n  async function derive(value){\n    const key=await crypto.subtle.importKey(\n      \"raw\",new TextEncoder().encode(value),\"PBKDF2\",false,[\"deriveBits\"]\n    );\n    const bits=await crypto.subtle.deriveBits(\n      {name:\"PBKDF2\",hash:\"SHA-256\",salt:b64Bytes(SALT_B64),iterations:ITERATIONS},\n      key,256\n    );\n    return bytesB64(bits);\n  }\n  function authState(){\n    try{return JSON.parse(sessionStorage.getItem(\"zr_admin_auth_state\")||'{\"fails\":0,\"lockUntil\":0}')}\n    catch{return {fails:0,lockUntil:0}}\n  }\n  function saveAuthState(v){sessionStorage.setItem(\"zr_admin_auth_state\",JSON.stringify(v))}\n  function randomToken(){\n    const a=new Uint8Array(24);crypto.getRandomValues(a);\n    return Array.from(a,x=>x.toString(16).padStart(2,\"0\")).join(\"\");\n  }\n  async function login(value){\n    const st=authState(),now=Date.now();\n    if(Number(st.lockUntil||0)>now){\n      return {ok:false,locked:true,remaining:Math.ceil((st.lockUntil-now)/1000)};\n    }\n    let match=false;\n    try{match=(await derive(value))===DIGEST_B64}catch{match=false}\n    if(match){\n      saveAuthState({fails:0,lockUntil:0});\n      sessionToken=randomToken();\n      sessionUntil=Date.now()+SESSION_MS;\n      return {ok:true};\n    }\n    const fails=Number(st.fails||0)+1;\n    if(fails>=MAX_FAILS){\n      const lockUntil=Date.now()+LOCK_MS;\n      saveAuthState({fails:0,lockUntil});\n      return {ok:false,locked:true,remaining:Math.ceil(LOCK_MS/1000)};\n    }\n    saveAuthState({fails,lockUntil:0});\n    return {ok:false,locked:false,attemptsLeft:MAX_FAILS-fails};\n  }\n  function ok(){\n    return !!sessionToken && Date.now()<sessionUntil;\n  }\n  function logout(){\n    sessionToken=\"\";\n    sessionUntil=0;\n  }\n  function remaining(){\n    return ok()?Math.max(0,sessionUntil-Date.now()):0;\n  }\n  return {login,ok,logout,remaining};\n})());"], ["function saveSmsSettingsFromUi(){", "function saveSmsSettingsFromUi(){\n  if(!adminGuard())return;"], ["function renderMenuAdmin(){", "function renderMenuAdmin(){\n  if(!adminGuard())return;"], ["window.editCafeMenu=function(id){", "window.editCafeMenu=function(id){\n  if(!adminGuard())return;"], ["function openNewCafeMenu(){", "function openNewCafeMenu(){\n  if(!adminGuard())return;"], ["function saveMenuEdit(){", "function saveMenuEdit(){\n  if(!adminGuard())return;"], ["function deleteMenuEdit(){", "function deleteMenuEdit(){\n  if(!adminGuard())return;"], ["function renderAdmin(){", "function renderAdmin(){\n  if(!adminGuard(false))return;"], ["window.openAdminBookingDetail=function(id){", "window.openAdminBookingDetail=function(id){\n  if(!adminGuard())return;"], ["window.requestBookingStatus=function(id,status){", "window.requestBookingStatus=function(id,status){\n  if(!adminGuard())return;"], ["function executePendingAdminAction(){", "function executePendingAdminAction(){\n  if(!adminGuard())return;"], ["window.openDay=function(date){", "window.openDay=function(date){\n  if(!adminGuard())return;"], ["window.toggleManualClose=function(date){", "window.toggleManualClose=function(date){\n  if(!adminGuard())return;"], ["window.toggleAutoCloseOverride=function(date){", "window.toggleAutoCloseOverride=function(date){\n  if(!adminGuard())return;"], ["window.setBookingStatus=function(id,status){", "window.setBookingStatus=function(id,status){\n  if(!adminGuard())return;"], ["function renderActivity(){", "function renderActivity(){\n  if(!adminGuard())return;"], ["function downloadActivityExcel(){", "function downloadActivityExcel(){\n  if(!adminGuard())return;"], ["function renderMealStatus(){", "function renderMealStatus(){\n  if(!adminGuard())return;"], ["window.showMealDay=function(date){", "window.showMealDay=function(date){\n  if(!adminGuard())return;"], ["function refreshAdminCurrentTab(){", "function refreshAdminCurrentTab(){\n  if(!adminGuard())return;"], ["function renderInquiries(){", "function renderInquiries(){\n  if(!adminGuard())return;"], ["$(\"saveBookingPeriod\").onclick=()=>{", "$(\"saveBookingPeriod\").onclick=()=>{\n  if(!adminGuard())return;"], ["function renderAdmin(){\n  if(!adminGuard(false))return;", "function adminGuard(showMessage=true){\n  if(AdminGate.ok())return true;\n  AdminGate.logout();\n  $(\"adminView\").style.display=\"none\";\n  $(\"startView\").classList.remove(\"hidden\");\n  if(showMessage)toast(\"관리자 로그인이 만료되었거나 필요합니다.\");\n  return false;\n}\n\nfunction renderAdmin(){\n  if(!adminGuard(false))return;"], ["$(\"adminLoginSubmit\").onclick=()=>{\n  if($(\"adminPassword\").value===ADMIN_PASSWORD){closeModal(\"adminLoginModal\");$(\"startView\").classList.add(\"hidden\");$(\"customerView\").classList.add(\"hidden\");$(\"successView\").classList.add(\"hidden\");$(\"cancelSuccessView\").classList.add(\"hidden\");$(\"adminView\").style.display=\"block\";renderAdmin();renderInquiries()}\n  else $(\"adminPwError\").classList.remove(\"hidden\");\n};", "$(\"adminLoginSubmit\").onclick=async()=>{\n  const btn=$(\"adminLoginSubmit\");\n  if(btn.disabled)return;\n  btn.disabled=true;\n  $(\"adminPwError\").classList.add(\"hidden\");\n  $(\"adminPwError\").textContent=\"비밀번호를 확인하고 있습니다.\";\n  try{\n    const result=await AdminGate.login($(\"adminPassword\").value);\n    $(\"adminPassword\").value=\"\";\n    if(result.ok){\n      closeModal(\"adminLoginModal\");\n      $(\"startView\").classList.add(\"hidden\");\n      $(\"customerView\").classList.add(\"hidden\");\n      $(\"successView\").classList.add(\"hidden\");\n      $(\"cancelSuccessView\").classList.add(\"hidden\");\n      $(\"adminView\").style.display=\"block\";\n      renderAdmin();renderInquiries();\n      toast(\"관리자 로그인 완료 · 30분 후 자동 만료\");\n    }else{\n      $(\"adminPwError\").classList.remove(\"hidden\");\n      if(result.locked){\n        const min=Math.max(1,Math.ceil(Number(result.remaining||0)/60));\n        $(\"adminPwError\").textContent=`로그인 시도가 잠겼습니다. 약 ${min}분 후 다시 시도해주세요.`;\n      }else{\n        $(\"adminPwError\").textContent=`비밀번호가 올바르지 않습니다. 남은 시도 ${result.attemptsLeft}회`;\n      }\n    }\n  }finally{\n    btn.disabled=false;\n  }\n};\n$(\"adminPassword\").addEventListener(\"keydown\",e=>{\n  if(e.key===\"Enter\"){$(\"adminLoginSubmit\").click()}\n});"], ["$(\"adminLogout\").onclick=goHome;", "$(\"adminLogout\").onclick=()=>{AdminGate.logout();goHome();};"], ["document.querySelectorAll(\"[data-tab]\").forEach(b=>b.onclick=()=>{", "document.querySelectorAll(\"[data-tab]\").forEach(b=>b.onclick=()=>{\n  if(!adminGuard())return;"], ["$(\"autoClose\").onchange=()=>{const s=settings();s.autoClose=$(\"autoClose\").checked;saveSettings(s);renderAdmin();renderVisitDays()};", "$(\"autoClose\").onchange=()=>{if(!adminGuard())return;const s=settings();s.autoClose=$(\"autoClose\").checked;saveSettings(s);renderAdmin();renderVisitDays()};"]];
(async()=>{
  try{
    if(typeof pako==='undefined') throw new Error('실행 모듈을 불러오지 못했습니다. 새로고침해주세요.');
    const [r1,r2]=await Promise.all([
      fetch('./data1.txt?v=27',{cache:'no-store'}),
      fetch('./data2.txt?v=27',{cache:'no-store'})
    ]);
    if(!r1.ok||!r2.ok) throw new Error('테스트 페이지 데이터를 불러오지 못했습니다.');
    const clean=s=>s.replace(/[^A-Za-z0-9+/=]/g,'');
    const a=clean(await r1.text()), b=clean(await r2.text());
    const bin=atob(a+b);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    let html=new TextDecoder('utf-8').decode(pako.ungzip(bytes));
    if(!html.includes('<!doctype html>')||!html.includes('</html>')) throw new Error('원본 페이지 복원에 실패했습니다.');
    for(const [from,to] of SECURITY_PATCH){
      if(!html.includes(from)) throw new Error('보안 패치 적용에 실패했습니다.');
      html=html.replace(from,to);
    }
    if(html.includes('ADMIN_PASSWORD=')) throw new Error('보안 패치 검증에 실패했습니다.');
    html=html.replace('</body>','<script src="./admin_features.js?v=1"><\/script><script src="./admin_features_v2_loader.js?v=6"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('error').innerHTML='<p style="color:#b23838;font-size:13px;line-height:1.6">로딩 실패<br>'+String(e.message||e)+'</p>';
  }
})();
</script>
