<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#38271e">
<title>주렁주렁 동탄점 예약관리</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#38271e;color:#1f2a23;overflow:hidden}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box;background:#38271e}.box{display:none;background:#fffdfa;border:1px solid rgba(91,52,36,.10);border-radius:18px;padding:26px;max-width:420px;width:100%;box-shadow:0 6px 24px rgba(30,20,14,.14)}.spin{width:34px;height:34px;border:4px solid #eadfd7;border-top-color:#720b0f;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#6d625c;line-height:1.6}
</style>
</head>
<body>
<div class="loading"><div class="box"><div class="spin"></div><b>주렁주렁 예약관리</b><br><small>관리자 전용 화면을 준비하는 중입니다.</small><div id="error"></div></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('./index.html?v=admin-entry-5',{cache:'no-store'});
    if(!r.ok)throw new Error('공통 예약 런타임을 불러오지 못했습니다.');
    let source=await r.text();
    const bridgeMarker='<script src="./reservation_firebase_bridge.js?v=1"><\\/script></body>';
    const adminMarker='<script src="./reservation_firebase_bridge.js?v=1"><\\/script><script src="./admin_entry_bootstrap_v1.js?v=1"><\\/script><script src="./admin_login_preview_v4_patch_v1.js?v=2"><\\/script><script src="./admin_login_intro_v1.js?v=2"><\\/script><script src="./admin_shell_v1.js?v=3"><\\/script><script src="./admin_shell_submenus_v1.js?v=1"><\\/script><script src="./admin_shell_submenu_customer_guard_v1.js?v=1"><\\/script><script src="./admin_shell_attention_v1.js?v=1"><\\/script><script src="./admin_smart_panel_v1.js?v=3"><\\/script><script src="./admin_shell_layout_polish_v1.js?v=1"><\\/script><script src="./admin_shell_layout_specificity_fix_v1.js?v=1"><\\/script><script src="./admin_shell_current_ui_fix_v1.js?v=1"><\\/script><script src="./admin_today_connection_guard_v1.js?v=1"><\\/script><script src="./admin_daily_memo_v1.js?v=1"><\\/script><script src="./admin_section_header_help_v1.js?v=1"><\\/script><script src="./admin_section_subtab_title_fix_v1.js?v=1"><\\/script><script src="./admin_workspace_frame_fix_v1.js?v=2"><\\/script><script src="./admin_operational_ui_alignment_v1.js?v=1"><\\/script><script src="./admin_sales_dashboard_v1.js?v=1"><\\/script><script src="./admin_sales_dashboard_v2_patch.js?v=2"><\\/script><script src="./admin_sales_dashboard_v3_finish.js?v=1"><\\/script><script src="./admin_sales_dashboard_v4_report_fix.js?v=1"><\\/script><script src="./admin_sales_dashboard_v5_ui_fix.js?v=1"><\\/script><script src="./admin_sales_dashboard_print_fix_v1.js?v=1"><\\/script><script src="./admin_sales_dashboard_compare_chart_v1.js?v=1"><\\/script><script src="./admin_sales_dashboard_daily_chart_v1.js?v=1"><\\/script><script src="./admin_today_print_fix_v1.js?v=1"><\\/script></body>';
    if(!source.includes(bridgeMarker))throw new Error('관리자 분리 연결 지점을 찾지 못했습니다.');
    const loginPrelude='<link id="zrAdminLoginVisualV1Style" rel="stylesheet" href="./admin_login_visual_v1.css?v=3"><style>#adminLoginModal:not([data-zr-login-visual="1"]){visibility:hidden!important}html.zr-admin-login-clean #adminLoginModal[data-zr-login-visual="1"]{visibility:visible!important}</style>';
    source=source.replace('</head>',loginPrelude+'</head>');
    source=source.replace(bridgeMarker,adminMarker);
    source=source.replace('<title>주렁주렁 단체예약 테스트</title>','<title>주렁주렁 동탄점 예약관리</title>');
    document.open();document.write(source);document.close();
  }catch(e){
    const box=document.querySelector('.box');if(box)box.style.display='block';
    document.getElementById('error').innerHTML='<p style="color:#b23838;font-size:13px;line-height:1.6">관리자 화면 로딩 실패<br>'+String(e.message||e)+'</p>';
  }
})();
</script>
</body>
</html>
