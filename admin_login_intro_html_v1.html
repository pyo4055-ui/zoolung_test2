<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주렁주렁 인트로</title>
<style>
  :root{
    --bg:#38271e;
    --dur:5.35s;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
  }
  body{
    display:grid;
    place-items:center;
    overflow:hidden;
  }
  .intro-frame{
    position:relative;
    width:min(100vw,calc(100vh * 16 / 9));
    aspect-ratio:16/9;
    overflow:hidden;
    isolation:isolate;
    background:var(--bg);
  }

  .animal-panel{
    position:absolute;
    inset:-1px;
    overflow:hidden;
    pointer-events:none;
  }
  .animal-panel img{
    position:absolute;
    display:block;
    max-width:none;
    user-select:none;
    -webkit-user-drag:none;
    will-change:transform,opacity;
    filter:drop-shadow(0 14px 22px rgba(21,10,6,.12));
  }

  .penguin-panel{
    z-index:1;
    clip-path:polygon(0 0,39% 0,31% 100%,0 100%);
  }
  .otter-panel{
    z-index:2;
    clip-path:polygon(39% 0,72% 0,64% 100%,31% 100%);
  }
  .capybara-panel{
    z-index:3;
    clip-path:polygon(72% 0,100% 0,100% 100%,64% 100%);
  }

  .penguin{
    width:42%;
    left:-1.5%;
    bottom:-1%;
    transform:translate3d(0,118%,0);
    opacity:0;
    animation:penguinIn 1.12s cubic-bezier(.18,.72,.22,1) .18s forwards;
  }
  .otter{
    width:48%;
    left:26.5%;
    top:-3%;
    transform:translate3d(0,-118%,0);
    opacity:0;
    animation:otterIn 1.12s cubic-bezier(.18,.72,.22,1) 1.20s forwards;
  }
  .capybara{
    width:43%;
    right:-2%;
    bottom:-2%;
    transform:translate3d(-128%,0,0);
    opacity:0;
    animation:capybaraIn 1.18s cubic-bezier(.18,.72,.22,1) 2.22s forwards;
  }

  .intro-copy{
    position:absolute;
    z-index:5;
    right:7.4%;
    top:50%;
    width:min(31%,520px);
    transform:translate3d(0,-42%,0) scale(.96);
    opacity:0;
    pointer-events:none;
    animation:copyIn .88s cubic-bezier(.2,.76,.24,1) 3.36s forwards;
  }
  .intro-copy img{
    display:block;
    width:100%;
    height:auto;
    max-height:31vh;
    object-fit:contain;
    object-position:center;
    user-select:none;
    -webkit-user-drag:none;
    filter:drop-shadow(0 12px 24px rgba(20,9,5,.10));
  }

  .warm-vignette{
    position:absolute;
    inset:0;
    z-index:4;
    pointer-events:none;
    background:
      linear-gradient(90deg,rgba(38,21,13,.05) 0%,rgba(38,21,13,0) 47%,rgba(38,21,13,.05) 100%),
      radial-gradient(circle at 50% 48%,rgba(255,236,211,.04),rgba(24,12,7,0) 62%);
  }

  @keyframes penguinIn{
    0%{transform:translate3d(0,118%,0);opacity:0}
    18%{opacity:1}
    78%{transform:translate3d(0,-2.3%,0);opacity:1}
    100%{transform:translate3d(0,0,0);opacity:1}
  }
  @keyframes otterIn{
    0%{transform:translate3d(0,-118%,0);opacity:0}
    18%{opacity:1}
    78%{transform:translate3d(0,2.3%,0);opacity:1}
    100%{transform:translate3d(0,0,0);opacity:1}
  }
  @keyframes capybaraIn{
    0%{transform:translate3d(-128%,0,0);opacity:0}
    18%{opacity:1}
    78%{transform:translate3d(2.3%,0,0);opacity:1}
    100%{transform:translate3d(0,0,0);opacity:1}
  }
  @keyframes copyIn{
    0%{transform:translate3d(22px,-42%,0) scale(.96);opacity:0}
    100%{transform:translate3d(0,-50%,0) scale(1);opacity:1}
  }

  @media(max-width:900px){
    .intro-frame{
      width:100vw;
      height:100svh;
      aspect-ratio:auto;
    }
    .penguin-panel{clip-path:polygon(0 0,46% 0,35% 100%,0 100%)}
    .otter-panel{clip-path:polygon(46% 0,80% 0,69% 100%,35% 100%)}
    .capybara-panel{clip-path:polygon(80% 0,100% 0,100% 100%,69% 100%)}
    .penguin{width:70%;left:-13%;bottom:3%}
    .otter{width:72%;left:18%;top:4%}
    .capybara{width:70%;right:-25%;bottom:7%}
    .intro-copy{
      right:5%;
      top:76%;
      width:min(47%,380px);
    }
  }

  @media(prefers-reduced-motion:reduce){
    .penguin,.otter,.capybara,.intro-copy{animation-duration:.01ms!important;animation-delay:0s!important}
  }
</style>
</head>
<body>
  <main class="intro-frame" aria-label="주렁주렁 관리자 인트로 애니메이션">
    <div class="animal-panel penguin-panel">
      <img class="penguin" src="https://i.ibb.co/8n1KSdTh/3-penguin-transparent.png" alt="" decoding="async">
    </div>
    <div class="animal-panel otter-panel">
      <img class="otter" src="https://i.ibb.co/XkpnjP9r/1-otter-transparent.png" alt="" decoding="async">
    </div>
    <div class="animal-panel capybara-panel">
      <img class="capybara" src="https://i.ibb.co/ksPyqJC7/2-capybara-transparent.png" alt="" decoding="async">
    </div>
    <div class="warm-vignette"></div>
    <div class="intro-copy">
      <img src="https://i.ibb.co/LDPssRz1/asdd.png" alt="주렁주렁" decoding="async">
    </div>
  </main>
<script>
  const notify=event=>{
    try{window.parent.postMessage({source:'zr-admin-intro-html-v1',event},'*')}catch{}
  };

  const preload=[
    'https://i.ibb.co/8n1KSdTh/3-penguin-transparent.png',
    'https://i.ibb.co/XkpnjP9r/1-otter-transparent.png',
    'https://i.ibb.co/ksPyqJC7/2-capybara-transparent.png',
    'https://i.ibb.co/LDPssRz1/asdd.png'
  ];

  let finished=false;
  const finish=()=>{
    if(finished)return;
    finished=true;
    notify('ended');
  };

  const start=()=>{
    notify('ready');
    notify('playing');
    setTimeout(finish,5350);
  };

  Promise.all(preload.map(src=>new Promise(resolve=>{
    const img=new Image();
    img.onload=resolve;
    img.onerror=resolve;
    img.src=src;
  }))).then(start).catch(start);

  setTimeout(finish,8000);
</script>
</body>
</html>
