<!doctype html>
<html lang="ko">
<head>

<style>
:root{--bg:#f6f7f4;--card:#fff;--text:#1f2a23;--muted:#6d756f;--line:#dfe5df;--green:#2f6b4f;--green2:#e9f3ed;--orange:#f8d7bf;--blue:#dff0f7;--yellow:#fff1b8;--play:#dff1d9;--gray:#edf0ed;--danger:#b23838}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(66px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#fff}.soft{background:var(--green2);color:var(--green)}.gray{background:#eef1ee;color:#3c453f}.danger{background:#f8eaea;color:var(--danger)}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line)}.top{max-width:1180px;margin:auto;padding:10px 12px;display:flex;align-items:center;gap:8px}.brand{font-size:16px;font-weight:900;line-height:1.15}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}.editLock{margin-left:auto;min-width:88px}.editLock.locked{background:#eef1ee;color:#5c665f}.editLock.unlocked{background:#fff0d8;color:#9a5a00;border:1px solid #efcf98}
.app{max-width:1180px;margin:auto;padding:7px 7px 70px}.toolbar{position:sticky;top:55px;z-index:20;background:rgba(246,247,244,.97);padding:6px 0;border-bottom:1px solid #e1e6e1}.toolbar.editing{background:#fff9ef}.controls{display:flex;gap:5px;align-items:center}.controls input{width:132px;border:1px solid #ccd5ce;border-radius:10px;padding:8px 7px;background:#fff;font-weight:800}.controls .add{margin-left:auto}.summary{display:flex;gap:5px;overflow:auto;white-space:nowrap;margin-top:5px;scrollbar-width:none}.pill{font-size:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 7px;color:var(--muted)}.pill b{color:var(--green)}.editHint{display:none;font-size:9px;color:#9a5a00;margin-top:5px;font-weight:800}.toolbar.editing .editHint{display:block}
.legend{display:flex;gap:4px;overflow:auto;white-space:nowrap;margin-top:5px}.legend span{font-size:9px;font-weight:800;border-radius:999px;padding:3px 6px;border:1px solid rgba(0,0,0,.06)}.f4{background:var(--orange)}.f5{background:var(--blue)}.meal{background:var(--yellow)}.play{background:var(--play)}.free{background:var(--gray)}
.ruler{position:relative;height:23px;border:1px solid #d9e0da;border-radius:8px 8px 0 0;background:#f1f4f1;margin:5px 0 4px;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(56,75,62,.12) 1px,transparent 1px)}.tick{position:absolute;top:6px;transform:translateX(-50%);font-size:7px;font-weight:900;color:#46544a}.tick.first{transform:none}.tick.end{transform:translateX(-100%)}
.list{display:flex;flex-direction:column;gap:4px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;min-height:103px;box-shadow:0 2px 9px rgba(30,50,36,.04)}.card.editable{box-shadow:0 0 0 1px #efcf98 inset,0 2px 9px rgba(30,50,36,.04)}.head{height:29px;display:flex;align-items:center;gap:4px;padding:3px 6px;border-bottom:1px solid #edf0ed}.org{font-size:11px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{font-size:8px;font-weight:800;border-radius:6px;padding:3px 5px;background:#eef3ef;white-space:nowrap}.mealTag{background:#fff3c8}.detail{margin-left:auto;padding:5px 7px;font-size:8px}.viewLocked .detail{display:none}
.meta{height:21px;display:flex;align-items:center;gap:4px;padding:1px 6px;font-size:7.5px;color:#667169;white-space:nowrap;overflow:auto;scrollbar-width:none}.meta .planT{font-weight:900;color:#35483b}.live{background:#f3f5f3;border-radius:5px;padding:2px 3px}.live.has{background:#e7f4ea;color:var(--green);font-weight:800}.editable .live[data-q],.editable .planT[data-q],.editable .memo,.editable .seg,.editable .check{cursor:pointer;outline:1px dashed rgba(154,90,0,.25)}.quick{margin-left:auto;display:flex;gap:3px}.check{height:18px;padding:0 4px;font-size:7px;border:1px solid #d8dfda;background:#fff;border-radius:5px;color:#606b63}.check.on{background:#e7f4ea;color:var(--green);border-color:#bfd7c6}
.timeline{height:36px;margin:0 6px 3px;position:relative;border:1px solid #d9e0da;border-radius:6px;background:#fbfcfa;overflow:hidden}.seg{position:absolute;top:3px;height:28px;border-radius:5px;border:1px solid rgba(33,43,36,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;line-height:1;touch-action:manipulation}.seg b{font-size:7.5px}.seg small{font-size:6px;color:#526159;margin-top:2px}.memo{min-height:17px;margin:0 6px 4px;padding:2px 5px;background:#fafcf9;border:1px solid #e4e9e5;border-radius:5px;font-size:7.5px;color:#68726b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.memo b{color:var(--green);margin-right:3px}.now{position:absolute;top:0;bottom:0;width:2px;background:#d95e54;z-index:8}.empty{text-align:center;padding:30px 10px;background:#fff;border:1px dashed #cbd9cf;border-radius:12px;color:var(--muted);font-size:12px}.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:18;background:var(--green);color:#fff;box-shadow:0 7px 22px rgba(47,107,79,.25)}.viewLocked .fab{display:none}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}.hidden{display:none!important}.sheet{width:100%;max-width:720px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:12px 13px calc(18px + env(safe-area-inset-bottom))}.handle{width:42px;height:4px;background:#cbd2cc;border-radius:99px;margin:0 auto 9px}.titleRow{display:flex;align-items:center;position:sticky;top:-12px;background:#fff;padding:8px 0 7px;z-index:3}.titleRow h2{margin:0;flex:1;font-size:17px}.section{border-top:1px solid #edf0ed;padding-top:10px;margin-top:9px}.section:first-of-type{border-top:0}.section h3{font-size:12px;margin:0 0 8px;color:#35483b}.form{display:grid;grid-template-columns:1fr 1fr;gap:7px}.full{grid-column:1/-1}label{display:block;font-size:10px;font-weight:800;margin:0 0 4px}input,select,textarea{width:100%;border:1px solid #ccd5ce;border-radius:9px;padding:9px;background:#fff;font-size:12px}textarea{min-height:62px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.bigcheck{background:#f9faf9;border:1px solid #d3ddd5;color:#4f5b53}.bigcheck.on{background:#e9f3ed;border-color:#bfd7c6;color:var(--green)}.segtools{display:flex;gap:5px;overflow:auto;margin-bottom:7px}.segrow{display:grid;grid-template-columns:1.2fr .9fr .9fr 30px;gap:4px;margin-bottom:4px}.segrow select{padding:7px 4px;font-size:10px}.del{padding:0;background:#f8eaea;color:var(--danger)}.actions{display:flex;gap:7px;position:sticky;bottom:-18px;background:#fff;padding:9px 0 calc(8px + env(safe-area-inset-bottom));margin-top:10px}.actions .save{flex:1}
.quickSheet{padding-bottom:calc(16px + env(safe-area-inset-bottom))}.quickTitle{font-size:16px;font-weight:900;margin:0 0 2px}.quickSub{font-size:11px;color:var(--muted);margin-bottom:10px}.quickTimes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}.timeBox{background:#f7f9f7;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.timeBox b{display:block;font-size:17px;margin-top:3px}.quickBtns{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.quickBtns button{min-height:44px}.quickWide{grid-column:1/-1}.quickClose{width:100%;margin-top:8px}
.login{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 7px 26px rgba(30,50,36,.08)}.loginbox h1{font-size:20px;margin:0 0 6px}.loginbox p{font-size:12px;color:var(--muted);margin:0 0 15px}.loginbox button{width:100%;margin-top:9px}.error{font-size:11px;color:var(--danger);margin-top:7px}.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:400;background:var(--green);color:#fff;border-radius:999px;padding:8px 12px;font-size:10px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}
@media(min-width:700px){.app{padding:12px 20px 70px}.card{min-height:115px}.timeline{height:42px}.seg{height:34px}.seg b{font-size:9px}.seg small{font-size:7px}}
</style>
</head>
<body class="viewLocked">
<div class="login" id="login"><div class="loginbox"><h1>현장 스케줄 로그인</h1><p>주렁주렁 동탄점 내부 테스트용</p><input id="pw" type="password" placeholder="비밀번호"><div class="error hidden" id="pwerr">비밀번호가 올바르지 않습니다.</div><button class="primary" id="loginBtn">로그인</button></div></div>
<header><div class="top"><div class="brand">주렁주렁 동탄점 <small>현장 단체 스케줄 · 테스트 버전</small></div><button class="editLock locked" id="editLock">🔒 수정 불가</button></div></header>
<main class="app">
<div class="toolbar" id="toolbar">
  <div class="controls"><button class="soft" id="prev">‹</button><input id="date" type="date"><button class="soft" id="next">›</button><button class="gray" id="today">오늘</button><button class="primary add" id="add">+ 단체</button></div>
  <div class="summary"><span class="pill"><b id="teams">0팀</b></span><span class="pill">예약 <b id="reserved">0명</b></span><span class="pill">실제 <b id="actual">0명</b></span><span class="pill" id="nowtxt">현재 --:--</span><span class="pill" id="rangeTxt">10:00~15:00</span></div>
  <div class="editHint">수정 가능 상태 · 시간 블록이나 시간 표시를 터치하면 바로 수정할 수 있습니다.</div>
  <div class="legend"><span class="f4">4F 베이직</span><span class="f5">5F 워터가든</span><span class="meal">식사</span><span class="play">놀이터</span><span class="free">자율/기타</span></div>
</div>
<div class="ruler" id="ruler"></div>
<div class="list" id="list"></div>
</main>
<button class="fab" id="fab">+ 스케줄 추가</button>
<div class="modal hidden" id="modal"><div class="sheet"><div class="handle"></div><div class="titleRow"><h2 id="mtitle">단체 스케줄 수정</h2><button class="gray" id="close">✕</button></div><div class="section"><h3>기본 예약 정보</h3><div class="form"><div class="full"><label>단체명</label><input id="org"></div><div><label>예약 유료인원</label><input id="res" type="number" min="0"></div><div><label>인솔/선생님</label><input id="tea" type="number" min="0"></div><div><label>예약 도착시간</label><select id="ps"></select></div><div><label>예약 퇴장시간</label><select id="pe"></select></div><div class="full"><label>식사</label><input id="meal" placeholder="도시락 / 카페주문 / 식사없음"></div></div></div><div class="section"><h3>당일 현장 정보</h3><div class="form"><div><label>실제 인원</label><input id="act" type="number" min="0" placeholder="미입력"></div><div><label>도착예정</label><select id="eta"></select></div><div><label>퇴장예정</label><select id="aend"></select></div></div><div class="checks"><button class="bigcheck" id="pay">결제완료 □</button><button class="bigcheck" id="book">컬러북 제공 □</button></div></div><div class="section"><h3>15분 단위 동선</h3><div class="segtools"><button class="soft" id="minus">전체 -15분</button><button class="soft" id="plus">전체 +15분</button><button class="gray" id="addseg">+ 구간</button></div><div id="segrows"></div></div><div class="section"><h3>단체 메모</h3><textarea id="memo" placeholder="연합단체, 연령, 지연, 현장 요청 등"></textarea></div><div class="actions"><button class="danger" id="del">삭제</button><button class="primary save" id="save">저장</button></div></div></div>
<div class="modal hidden" id="quickModal"><div class="sheet quickSheet"><div class="handle"></div><div class="quickTitle" id="quickTitle">시간 빠른 수정</div><div class="quickSub" id="quickSub"></div><div class="quickTimes"><div class="timeBox">시작<b id="qStart">--:--</b></div><div class="timeBox">종료<b id="qEnd">--:--</b></div></div><div class="quickBtns"><button class="soft" id="qStartMinus">시작 -15분</button><button class="soft" id="qStartPlus">시작 +15분</button><button class="soft" id="qEndMinus">종료 -15분</button><button class="soft" id="qEndPlus">종료 +15분</button><button class="gray quickWide" id="qAllMinus">구간 전체 -15분</button><button class="gray quickWide" id="qAllPlus">구간 전체 +15분</button></div><button class="primary quickClose" id="qClose">완료</button></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{"use strict";
const KEY="zr_schedule_gh_v2",PK="zr_schedule_date_v2",START_MIN=600,MAX_PICK=1080,SLOT=15,PH="c45973b6d8d924da6fbb04040e26c439022e1855c0e3679a619acc5130cb8342",T={f4:["4F 베이직","f4"],f5:["5F 워터가든","f5"],meal:["식사","meal"],play:["놀이터","play"],free:["자율관람","free"]},$=x=>document.getElementById(x),pad=n=>String(n).padStart(2,"0"),tm=m=>pad(Math.floor(m/60))+":"+pad(m%60),min=t=>{if(!t)return null;let a=t.split(":").map(Number);return a[0]*60+a[1]},esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])),id=()=>"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),today=()=>{let d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())},shift=(s,n)=>{let d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())},get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}},set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};let editMode=false;
async function sha(s){let b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}async function login(){if(await sha($("pw").value)===PH){sessionStorage.setItem("zr_schedule_auth","1");$("login").classList.add("hidden");render()}else $("pwerr").classList.remove("hidden")}$("loginBtn").onclick=login;$("pw").onkeydown=e=>{if(e.key==="Enter")login()};if(sessionStorage.getItem("zr_schedule_auth")==="1")$("login").classList.add("hidden");
function segs(order){let a=["10:30","11:15","12:00","12:45"],b=["11:15","12:00","12:45","13:30"];return order.map((x,i)=>({id:id(),type:x,start:a[i],end:b[i]}))}function samples(d){return [{id:id(),date:d,org:"위즈아이어린이집",res:24,tea:5,act:"",ps:"10:30",pe:"14:00",eta:"",aend:"",meal:"도시락",pay:false,book:false,memo:"",segments:segs(["f4","meal","play","f5"])},{id:id(),date:d,org:"비봉어린이집",res:11,tea:4,act:"",ps:"10:30",pe:"14:30",eta:"",aend:"",meal:"카페주문",pay:false,book:false,memo:"",segments:segs(["f4","meal","f5","play"])},{id:id(),date:d,org:"아이해피어린이집",res:18,tea:3,act:"",ps:"10:45",pe:"14:15",eta:"",aend:"",meal:"도시락",pay:false,book:false,memo:"만 1~2세",segments:segs(["f5","meal","play","f4"])},{id:id(),date:d,org:"피오리어린이집",res:21,tea:4,act:"",ps:"11:00",pe:"14:30",eta:"",aend:"",meal:"식사없음",pay:false,book:false,memo:"개구쟁이어린이집 연합",segments:segs(["play","f4","free","f5"])},{id:id(),date:d,org:"주렁어린이집",res:30,tea:6,act:"",ps:"10:30",pe:"14:30",eta:"",aend:"",meal:"카페주문",pay:false,book:false,memo:"",segments:segs(["f5","play","meal","f4"])}]}
let data=get(KEY,null);if(!data||!Array.isArray(data.groups)){data={groups:samples(today())};set(KEY,data)}let date=get(PK,today()),eid=null,draft=null,qState=null;function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),1300)}function list(){return data.groups.filter(g=>g.date===date).sort((a,b)=>String(a.ps).localeCompare(String(b.ps)))}
function axisFor(groups){let used=[900];groups.forEach(g=>{[g.pe,g.aend].forEach(t=>{let m=min(t);if(m)used.push(m)});(g.segments||[]).forEach(s=>{let m=min(s.end);if(m)used.push(m)})});let max=Math.max(...used),end=Math.max(900,Math.ceil(max/60)*60);end=Math.min(Math.max(end,900),MAX_PICK);return {start:START_MIN,end}}function pct(t,axis){let m=min(t);if(m==null)return 0;return Math.max(0,Math.min(100,(m-axis.start)/(axis.end-axis.start)*100))}function renderRuler(axis){let span=axis.end-axis.start,step=span>360?60:30,h='<div class="grid" style="background-size:'+((SLOT/span)*100)+'% 100%"></div>';for(let m=axis.start;m<=axis.end;m+=step){let p=(m-axis.start)/span*100,cl=m===axis.start?" first":m===axis.end?" end":"";h+=`<span class="tick${cl}" style="left:${p}%">${tm(m)}</span>`}$("ruler").innerHTML=h;$("rangeTxt").textContent=tm(axis.start)+"~"+tm(axis.end)}
function render(){$("date").value=date;let a=list(),axis=axisFor(a),n=new Date();renderRuler(axis);$("teams").textContent=a.length+"팀";$("reserved").textContent=a.reduce((s,g)=>s+Number(g.res||0),0)+"명";$("actual").textContent=a.reduce((s,g)=>s+(g.act===""?0:Number(g.act||0)),0)+"명";$("nowtxt").textContent="현재 "+pad(n.getHours())+":"+pad(n.getMinutes());document.body.classList.toggle("viewLocked",!editMode);$("toolbar").classList.toggle("editing",editMode);$("editLock").className="editLock "+(editMode?"unlocked":"locked");$("editLock").textContent=editMode?"🔓 수정 가능":"🔒 수정 불가";if(!a.length){$("list").innerHTML='<div class="empty">등록된 단체 스케줄이 없습니다.</div>';return}let nowm=n.getHours()*60+n.getMinutes(),np=date===today()&&nowm>=axis.start&&nowm<=axis.end?(nowm-axis.start)/(axis.end-axis.start)*100:null;$("list").innerHTML=a.map(g=>{let ss=(g.segments||[]).map(s=>{let tt=T[s.type]||T.free,w=Math.max(1,pct(s.end,axis)-pct(s.start,axis));return `<div class="seg ${tt[1]}" data-seg="${s.id}" data-g="${g.id}" style="left:${pct(s.start,axis)}%;width:${w}%"><b>${tt[0]}</b>${w>=11?`<small>${s.start}~${s.end}</small>`:""}</div>`}).join("");return `<article class="card ${editMode?"editable":""}"><div class="head"><div class="org">${esc(g.org)}</div><span class="tag">${g.res}(${g.tea})명</span><span class="tag mealTag">${esc(g.meal||"")}</span><button class="soft detail" data-e="${g.id}">상세</button></div><div class="meta"><span class="planT" data-q="plan" data-id="${g.id}">예약 ${g.ps}~${g.pe}</span><span class="live ${g.eta?"has":""}" data-q="eta" data-id="${g.id}">도착예정 ${g.eta||"--:--"}</span><span class="live ${g.aend?"has":""}" data-q="aend" data-id="${g.id}">퇴장예정 ${g.aend||"--:--"}</span><span class="live ${g.act!==""?"has":""}" data-q="act" data-id="${g.id}">실제 ${g.act!==""?g.act+"명":"--"}</span><div class="quick"><button class="check ${g.pay?"on":""}" data-c="pay" data-id="${g.id}">${g.pay?"✓ ":""}결제</button><button class="check ${g.book?"on":""}" data-c="book" data-id="${g.id}">${g.book?"✓ ":""}컬러북</button></div></div><div class="timeline"><div class="grid" style="background-size:${(SLOT/(axis.end-axis.start))*100}% 100%"></div>${ss}${np==null?"":`<div class="now" style="left:${np}%"></div>`}</div><div class="memo" data-m="${g.id}"><b>메모</b>${esc(g.memo||"메모 없음 · 눌러서 입력")}</div></article>`}).join("");document.querySelectorAll("[data-e]").forEach(x=>x.onclick=()=>editMode?open(x.dataset.e):lockedMsg());document.querySelectorAll("[data-m]").forEach(x=>x.onclick=()=>{if(!editMode)return lockedMsg();open(x.dataset.m);setTimeout(()=>$("memo").focus(),80)});document.querySelectorAll("[data-c]").forEach(x=>x.onclick=()=>{if(!editMode)return lockedMsg();let g=data.groups.find(z=>z.id===x.dataset.id);g[x.dataset.c]=!g[x.dataset.c];set(KEY,data);render()});document.querySelectorAll("[data-seg]").forEach(x=>x.onclick=()=>{if(!editMode)return lockedMsg();openQuick(x.dataset.g,x.dataset.seg)});document.querySelectorAll("[data-q]").forEach(x=>x.onclick=()=>{if(!editMode)return lockedMsg();quickField(x.dataset.id,x.dataset.q)})}
function lockedMsg(){toast("상단에서 '수정 가능'을 먼저 켜주세요.")}$("editLock").onclick=()=>{editMode=!editMode;render();toast(editMode?"수정 가능 상태입니다.":"수정을 잠갔습니다.")};
function quickField(gid,kind){let g=data.groups.find(z=>z.id===gid);if(!g)return;if(kind==="act"){let v=prompt("실제 인원",g.act===""?"":g.act);if(v===null)return;g.act=v===""?"":Math.max(0,Number(v||0))}else if(kind==="eta"||kind==="aend"){let label=kind==="eta"?"도착예정":"퇴장예정",cur=g[kind]||"";let v=prompt(label+" 시간 (예: 15:30)",cur);if(v===null)return;if(v!==""&&!/^\d{2}:\d{2}$/.test(v))return toast("시간을 15:30 형식으로 입력해주세요.");g[kind]=v}else if(kind==="plan"){open(gid);return}set(KEY,data);render()}
function openQuick(gid,sid){let g=data.groups.find(z=>z.id===gid),s=g?.segments?.find(z=>z.id===sid);if(!g||!s)return;qState={g,s};$("quickTitle").textContent=(T[s.type]||T.free)[0]+" 빠른 수정";$("quickSub").textContent=g.org+" · 블록 터치 수정";updateQuick();$("quickModal").classList.remove("hidden")}function updateQuick(){$("qStart").textContent=qState.s.start;$("qEnd").textContent=qState.s.end}function qShift(which,delta){let s=qState.s,a=min(s.start),b=min(s.end);if(which==="start")a+=delta;else if(which==="end")b+=delta;else{a+=delta;b+=delta}a=Math.max(START_MIN,Math.min(MAX_PICK-SLOT,a));b=Math.max(START_MIN+SLOT,Math.min(MAX_PICK,b));if(b<=a){if(which==="start")a=b-SLOT;else b=a+SLOT}s.start=tm(a);s.end=tm(b);set(KEY,data);updateQuick();render()}$("qStartMinus").onclick=()=>qShift("start",-15);$("qStartPlus").onclick=()=>qShift("start",15);$("qEndMinus").onclick=()=>qShift("end",-15);$("qEndPlus").onclick=()=>qShift("end",15);$("qAllMinus").onclick=()=>qShift("all",-15);$("qAllPlus").onclick=()=>qShift("all",15);$("qClose").onclick=()=>{$("quickModal").classList.add("hidden");qState=null};
function fill(el,blank){let h=blank?'<option value="">--:--</option>':"";for(let m=START_MIN;m<=MAX_PICK;m+=SLOT){let t=tm(m);h+=`<option value="${t}">${t}</option>`}el.innerHTML=h}["ps","pe"].forEach(x=>fill($(x),false));["eta","aend"].forEach(x=>fill($(x),true));function fresh(){return {id:id(),date,org:"",res:15,tea:0,act:"",ps:"10:30",pe:"14:00",eta:"",aend:"",meal:"도시락",pay:false,book:false,memo:"",segments:segs(["f4","meal","play","f5"])}}function open(i){if(!editMode)return lockedMsg();eid=i||null;draft=JSON.parse(JSON.stringify(i?data.groups.find(g=>g.id===i):fresh()));$("mtitle").textContent=i?"단체 스케줄 상세 수정":"단체 스케줄 추가";$("del").style.visibility=i?"visible":"hidden";["org","res","tea","act","ps","pe","eta","aend","meal","memo"].forEach(k=>$(k).value=draft[k]??"");check();rows();$("modal").classList.remove("hidden")}function check(){$("pay").classList.toggle("on",draft.pay);$("pay").textContent="결제완료 "+(draft.pay?"✓":"□");$("book").classList.toggle("on",draft.book);$("book").textContent="컬러북 제공 "+(draft.book?"✓":"□")}function rows(){$("segrows").innerHTML=(draft.segments||[]).map((s,i)=>`<div class="segrow" data-i="${i}"><select data-k="type">${Object.entries(T).map(([k,v])=>`<option value="${k}" ${k===s.type?"selected":""}>${v[0]}</option>`).join("")}</select><select data-k="start">${opts(s.start)}</select><select data-k="end">${opts(s.end)}</select><button class="del" data-d="${i}">×</button></div>`).join("");document.querySelectorAll(".segrow").forEach(r=>r.querySelectorAll("select").forEach(s=>s.onchange=()=>draft.segments[+r.dataset.i][s.dataset.k]=s.value));document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{draft.segments.splice(+b.dataset.d,1);rows()})}function opts(v){let h="";for(let m=START_MIN;m<=MAX_PICK;m+=SLOT){let t=tm(m);h+=`<option value="${t}" ${t===v?"selected":""}>${t}</option>`}return h}$("pay").onclick=()=>{draft.pay=!draft.pay;check()};$("book").onclick=()=>{draft.book=!draft.book;check()};function move(n){draft.segments=draft.segments.map(s=>({...s,start:tm(Math.max(START_MIN,Math.min(MAX_PICK-SLOT,min(s.start)+n))),end:tm(Math.max(START_MIN+SLOT,Math.min(MAX_PICK,min(s.end)+n)))}));rows()}$("minus").onclick=()=>move(-15);$("plus").onclick=()=>move(15);$("addseg").onclick=()=>{draft.segments.push({id:id(),type:"free",start:"10:00",end:"10:30"});rows()};$("save").onclick=()=>{["org","res","tea","act","ps","pe","eta","aend","meal","memo"].forEach(k=>draft[k]=$(k).value);draft.res=Number(draft.res||0);draft.tea=Number(draft.tea||0);if(!draft.org)return toast("단체명을 입력해주세요.");if(eid)data.groups[data.groups.findIndex(g=>g.id===eid)]=draft;else data.groups.push(draft);set(KEY,data);$("modal").classList.add("hidden");render();toast("저장했습니다.")};$("del").onclick=()=>{if(!eid||!confirm("삭제할까요?"))return;data.groups=data.groups.filter(g=>g.id!==eid);set(KEY,data);$("modal").classList.add("hidden");render()};$("close").onclick=()=>$("modal").classList.add("hidden");$("add").onclick=$("fab").onclick=()=>open();function setdate(d){date=d;set(PK,date);render()}$("date").onchange=()=>setdate($("date").value);$("prev").onclick=()=>setdate(shift(date,-1));$("next").onclick=()=>setdate(shift(date,1));$("today").onclick=()=>setdate(today());window.addEventListener("storage",e=>{if(e.key===KEY){data=get(KEY,data);render()}});setInterval(()=>{let latest=get(KEY,data);if(JSON.stringify(latest)!==JSON.stringify(data)){data=latest;render()}},3000);render();setInterval(render,60000)})();
</script>
</body></html>
