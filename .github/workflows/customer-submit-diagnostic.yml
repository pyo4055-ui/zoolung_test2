name: Customer submit diagnostic
on:
  push:
    branches:
      - diagnose-reservation-submit-20260909
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect compressed customer submit core
        run: node scripts/customer_submit_diagnostic_20260909.mjs
      - name: Commit diagnostic output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostic_output.txt
          git commit -m 'test: save reservation submit diagnostic output [skip ci]'
          git push
