name: Refactor contract check
on:
  pull_request:
  push:
    branches:
      - refactor-preserve-behavior
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refactor_contract_check.mjs
      - name: Verify cancellation history visibility
        run: node scripts/cancellation_contract_check.mjs
      - name: Verify admin group search safety
        run: node scripts/admin_group_search_contract_check.mjs
      - name: Verify customer guide modal ordering
        run: node scripts/customer_guide_transition_contract_check.mjs
      - name: Verify customer reservation status clarity
        run: node scripts/customer_status_banner_contract_check.mjs
      - name: Verify guide map URL draft protection
        run: node scripts/guide_map_draft_contract_check.mjs
      - name: Verify admin tab active cleanup
        run: node scripts/admin_tab_active_contract_check.mjs
      - name: Verify compact calendar status summary
        run: node scripts/admin_calendar_status_summary_contract_check.mjs
      - name: Verify calendar booking status selector
        run: node scripts/admin_calendar_status_select_contract_check.mjs
      - name: Verify separate actual-payment workspace
        run: node scripts/admin_settlement_workspace_contract_check.mjs
      - name: Verify settlement action survives rerenders
        run: node scripts/admin_settlement_ui_stability_contract_check.mjs
      - name: Verify reservation activity date filtering
        run: node scripts/admin_activity_filter_contract_check.mjs
      - name: Verify playground booking order and guidance
        run: node scripts/customer_playground_booking_guard_contract_check.mjs
      - name: Verify configurable holiday booking
        run: node scripts/customer_holiday_booking_contract_check.mjs
      - name: Verify customer return-home confirmation
        run: node scripts/customer_return_home_contract_check.mjs
      - name: Verify inquiry visit details
        run: node scripts/customer_inquiry_visit_contract_check.mjs
      - name: Verify preview visit management
        run: node scripts/admin_preview_visit_contract_check.mjs
      - name: Verify minimum paid group booking rule
        run: node scripts/customer_group_minimum_contract_check.mjs
      - name: Verify modal interaction consistency
        run: node scripts/modal_ux_consistency_contract_check.mjs
      - name: Verify admin unsaved changes warning
        run: node scripts/admin_unsaved_changes_contract_check.mjs
      - name: Verify Excel download reliability
        run: node scripts/admin_excel_reliability_contract_check.mjs
      - name: Verify manual schedule customer notification
        run: node scripts/admin_schedule_customer_notify_contract_check.mjs
      - name: Verify booking hold behavior
        run: node scripts/booking_hold_contract_check.mjs
      - name: Verify onsite auth isolation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('schedule_refactor/core.js','utf8');
          if(!s.includes('initializeApp(firebaseConfig,"zrOnsiteSchedule")')){
            console.error('Onsite Firebase Auth must use an isolated named app.');
            process.exit(1);
          }
          if(s.includes('initializeApp(firebaseConfig);')){
            console.error('Default Firebase app must not be used by onsite schedule.');
            process.exit(1);
          }
          console.log('OK: onsite Firebase Auth is isolated from reservation admin tabs');
          NODE
