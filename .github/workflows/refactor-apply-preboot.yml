name: Apply refactor preboot shield
on:
  push:
    branches:
      - refactor-preserve-behavior
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-preserve-behavior
      - name: Patch preboot visibility and contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          anchor = "    if(html.includes('ADMIN_PASSWORD=')) throw new Error('보안 패치 검증에 실패했습니다.');\n"
          injection = anchor + "    const prebootStyle='<style id=\"zrPreBootStyle\">html{background:#f6f7f4!important}body{visibility:hidden!important}</style>';\n    if(!html.includes('id=\"zrPreBootStyle\"')) html=html.replace('</head>',prebootStyle+'</head>');\n"
          if index.count(anchor) != 1:
              raise SystemExit('index preboot anchor mismatch')
          if 'zrPreBootStyle' not in index:
              index = index.replace(anchor, injection)
              index_path.write_text(index, encoding='utf-8')

          loader_path = Path('admin_features_v2_loader.js')
          loader = loader_path.read_text(encoding='utf-8')
          old = "  requestAnimationFrame(()=>requestAnimationFrame(removeBootShield));"
          new = "  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('zrPreBootStyle')?.remove();removeBootShield()}));"
          if old in loader:
              loader = loader.replace(old, new, 1)
              loader_path.write_text(loader, encoding='utf-8')
          elif new not in loader:
              raise SystemExit('loader reveal anchor mismatch')

          contract_path = Path('scripts/refactor_contract_check.mjs')
          contract = contract_path.read_text(encoding='utf-8')
          contract = contract.replace("'index.html':'0499a5fbf82c3c39b7812e18c9a26c2b64584db7'", "'index.html':'3d92d7e08b85eb2326aeba0d0def53659dac0ec9'")
          contract = contract.replace("'zrRefactorBootShield','requestAnimationFrame(()=>requestAnimationFrame(removeBootShield))'", "'zrRefactorBootShield',\"document.getElementById('zrPreBootStyle')?.remove()\",\"requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('zrPreBootStyle')?.remove();removeBootShield()}))\"")
          if "'index.html':'3d92d7e08b85eb2326aeba0d0def53659dac0ec9'" not in contract:
              raise SystemExit('contract index baseline not updated')
          if "document.getElementById('zrPreBootStyle')?.remove()" not in contract:
              raise SystemExit('contract preboot reveal check not updated')
          contract_path.write_text(contract, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html admin_features_v2_loader.js scripts/refactor_contract_check.mjs
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "test: update preboot contract baseline"
          git push origin HEAD:refactor-preserve-behavior
