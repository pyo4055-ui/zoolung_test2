name: Stability v21 checks

on:
  push:
    branches:
      - hardening/stability-v21
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax checks
        run: |
          node --check admin_features_v2_loader.js
          node --check admin_features_v9_patch.js
          node --check customer_visit_guide_fix_v20.js
          node --check reservation_firebase_bridge.js

      - name: Loader and Firestore patch invariants
        run: |
          ! grep -q "customer_visit_guide_v16.js" admin_features_v2_loader.js
          grep -q "customer_visit_guide_v19.js?v=19" admin_features_v9_patch.js
          grep -q "customer_visit_guide_fix_v20.js?v=21" admin_features_v9_patch.js
          grep -q "zrGuideSaveOwner='v20'" customer_visit_guide_fix_v20.js
          grep -q "if(c!==undefined)out\[k\]=c" reservation_firebase_bridge.js
